[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetrabot"
version = "1.0.0"
description = "A modular Discord bot with slash commands, prefix commands and MongoDB persistence."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "discord.py>=2.4.0",
    "motor>=3.7.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tetrabot = "tetrabot.app:main"

[tool.setuptools.packages.find]
include = ["tetrabot*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I"]
ignore = [
    "E501",   # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
