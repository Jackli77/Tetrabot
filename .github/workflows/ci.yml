name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Tests and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project and its dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check tetrabot tests

      - name: Test (pytest)
        run: pytest

      # The agent must still work when it is exercised end to end, without
      # Discord, MongoDB, Ollama or any network access.
      - name: The agent demo must run
        run: python -m tetrabot demo

      - name: The agent evaluation must pass
        run: python -m tetrabot eval
